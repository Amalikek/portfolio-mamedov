<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Гарягды — художник. Живопись." />
  <title>Гарягды</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#top" data-i18n="brand">Гарягды</a>
    <nav class="nav" id="nav" aria-label="Main">
      <a href="#works" data-i18n="nav_works">Работы</a>
      <a href="#about" data-i18n="nav_about">О художнике</a>
      <a href="#contact" data-i18n="nav_contact">Контакты</a>
    </nav>
    <div class="header-actions">
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" class="lang-btn is-active" data-lang="ru">RU</button>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
        <button type="button" class="lang-btn" data-lang="az">AZ</button>
      </div>
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Menu" aria-expanded="false">
        <span></span><span></span>
      </button>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <button type="button" class="hero-frame" data-index="0" aria-label="Open work">
        <img src="assets/art/building.png" alt="" id="heroImg" />
      </button>
    </section>

    <section class="section works" id="works">
      <h2 class="section-title" data-i18n="works_title">Работы</h2>
      <div class="gallery" id="gallery"></div>
    </section>

    <section class="section about" id="about">
      <h2 class="section-title" data-i18n="about_title">О художнике</h2>
      <p class="about-name" data-i18n="brand">Гарягды</p>
      <p class="about-text" data-i18n="about_text">Живопись.</p>
    </section>

    <section class="section contact" id="contact">
      <h2 class="section-title" data-i18n="contact_title">Контакты</h2>
      <p class="contact-lead" data-i18n="contact_lead">Связаться</p>
      <div class="contact-links">
        <a href="tel:+79856279652">+7 (985) 627-96-52</a>
        <a href="mailto:amal0@ya.ru">amal0@ya.ru</a>
      </div>
      <div class="socials">
        <span class="socials-label" data-i18n="socials_label">Соцсети</span>
        <p class="socials-soon" data-i18n="socials_soon">скоро</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> <span data-i18n="brand">Гарягды</span></p>
  </footer>

  <div class="lightbox" id="lightbox" hidden>
    <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Close">×</button>
    <button type="button" class="lightbox-nav prev" id="lightboxPrev" aria-label="Previous">‹</button>
    <figure class="lightbox-figure">
      <img id="lightboxImg" src="" alt="" />
    </figure>
    <button type="button" class="lightbox-nav next" id="lightboxNext" aria-label="Next">›</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
